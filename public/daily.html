<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giornaliero · AlleOClockCalc</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css?v=phase2-20261113"><meta name="theme-color" content="#0f172a"></head>
<body><header class="app-header">
  <div style="display:flex;gap:10px;align-items:center">
    <a href="index.html" class="logo" aria-label="Home"><img src="img/logo.svg" alt="AlleOClockCalc"></a>
    <button id="themeToggle" class="chip">🌓</button>
  </div>
  <nav class="nav">
    <a href="daily.html" class="requires-auth disabled" data-i18n="nav_daily">Giornaliero</a>
    <a href="monthly.html" class="requires-auth disabled" data-i18n="nav_monthly">Mensile</a>
    <a href="report.html" class="requires-auth disabled" data-i18n="nav_reports">Report & PDF</a>
    <a href="employer.html" class="requires-auth disabled" data-i18n="nav_employer">Dashboard Datore</a>
    <a href="guide.html" data-i18n="nav_guide">Guida</a>
    <select id="langSelect" class="chip"><option value="it">IT</option><option value="en">EN</option><option value="fr">FR</option><option value="de">DE</option><option value="es">ES</option></select>
  </nav>
</header><main class="container">
  <div class="card auth-required" style="display:none">
    <h2 data-i18n="daily_title">Inserimento Giornaliero</h2>
    <div class="grid grid-2">
      <label><span data-i18n="date">Data</span><input type="date" id="date"></label>
      <label><span data-i18n="hourly_rate">Paga oraria (€)</span><input type="number" id="hourlyRate" step="0.01"></label>
    </div>
    <label><input type="checkbox" id="dayOff"> <span data-i18n="day_off">Giorno libero</span></label>
    <div class="box morning"><h3 data-i18n="morning">Mattina</h3><div class="grid grid-2">
      <label><span data-i18n="in">Ingresso</span><input type="time" id="mIn"></label>
      <label><span data-i18n="out">Uscita</span><input type="time" id="mOut"></label></div></div>
    <div class="box evening"><h3 data-i18n="evening">Sera</h3><div class="grid grid-2">
      <label><span data-i18n="in">Ingresso</span><input type="time" id="eIn"></label>
      <label><span data-i18n="out">Uscita</span><input type="time" id="eOut"></label></div></div>
    <div class="grid grid-2">
      <button id="btnSave" data-i18n="save_day">Salva giorno</button>
      <button id="btnLoad" class="secondary" data-i18n="load_day">Carica giorno</button>
    </div>
    <div class="summary"><p><span data-i18n="daily_hours">Ore del giorno</span>: <b id="dailyHours">0.00</b></p>
    <p><span data-i18n="daily_pay">Guadagno del giorno</span>: € <b id="dailyPay">0.00</b></p></div>
  </div>
</main>
<div id="loader" class="hidden"><div class="spinner"></div></div><div id="toastWrap"></div>
<script type="module">import * as theme from './js/theme.js'; import './js/pwa.js'; import './js/i18n.js';</script><script type="module">import './js/app.js'; import './js/auth.js'; import './js/daily.js';</script></body></html>
